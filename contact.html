    <!-- 提前应用主题，避免深色模式下的白屏闪烁（与站点主题键 site-theme 保持一致） -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('site-theme') || localStorage.getItem('theme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var theme = (saved === 'dark' || saved === 'light') ? saved : (prefersDark ? 'dark' : 'light');
                document.documentElement.dataset.theme = theme;
                document.documentElement.classList.toggle('dark-mode', theme === 'dark');
            } catch (e) {}
        })();
    </script>

        /* 全部使用站点主题变量（--md-*），自动跟随博客的浅色 / 深色主题 */
        .warning {
            max-width: 720px;
            margin: 80px auto;
            padding: 30px 35px;
            background: var(--md-surface-container, #ffffff);
            border: 1px solid rgba(15, 157, 88, 0.18);
            border-radius: 24px;

            transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
        }
        .warning h2 {

            margin-top: 0;
            margin-bottom: 0.75rem;
            display: flex;

            line-height: 1;

        .warning p {

            line-height: 1.5;

        }
        .target-link-box {
            background: var(--md-surface, #f5f7fa);

            transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
        }
        .target-link-box a {
            color: var(--md-primary, #0f9d58);
            font-weight: 600;
            text-decoration: none;
        }
        .target-link-box a:hover {
            text-decoration: underline;
        }
        .anniu {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .anniu a {
            display: inline-block;
            padding: 10px 32px;
            border-radius: 40px;
            background: var(--md-primary-container, #e6f4ed);
            border: 1px solid rgba(15, 157, 88, 0.4);
            font-size: 1.2rem;
            font-weight: 550;
            transition: all 0.2s ease;
            min-width: 110px;
            text-align: center;
            color: var(--md-primary-hover, #0b7a44);
            text-decoration: none;
        }
        .anniu a:hover {
            background: var(--md-primary, #0f9d58);
            color: var(--md-on-primary, #ffffff);
        }
        .anniu a.cancel-link {

            color: var(--md-on-surface-variant, #5f6368);
        }
        .anniu a.cancel-link:hover {

            border-color: rgba(127, 127, 127, 0.4);
            color: var(--md-on-surface, #1f1f1f);
        }
        .anniu a:active {

        .url-note {

        }

    <script>
        (function() {
            'use strict';
            var TARGET = 'https://muselink.cc/Creeper156';

            // 尝试自动跳转（使用 replace，避免在历史记录中留下当前页）
            function tryRedirect() {
                try {
                    window.location.replace(TARGET);
                } catch (e) {
                    // 跳转失败时保留页面，用户可点击手动链接
                }
            }

            // 等 DOM 就绪后再跳转：defer 的 common.js 会在此之前注入主题切换按钮，
            // 保证按钮与其它页面完全一致；若跳转被拦截，页面保留且按钮可用。
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', tryRedirect, { once: true });
            } else {
                tryRedirect();
            }
        })();
    </script>
