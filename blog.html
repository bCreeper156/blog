<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客文章 - 156博客</title>
    <script src="/js/legacy_redirect.js"></script>
    <script src="js/dark_fix.js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/blog.css">
    <script src="/js/loading.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/page_transition.js" defer></script>
    <script src="/js/jump_warning.js" defer></script>
    <script src="/js/blog_list.js"></script>
    <script src="/js/nope.js"></script>
    <link rel="icon" type="image/png" href="/images/LOGO_dark.png">
</head>
<body>
    <!-- Placeholder: header injected by /js/common.js -->
    <div id="site-header"></div>
<main class="container">
        <div class="controls">
            <div class="search-box">
                <span class="search-icon material-symbols-rounded">search</span>
                <input type="text" id="search" placeholder="搜索文章...">
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">全部</button>
	            <button class="filter-btn" data-filter="游戏">游戏</button>
                <button class="filter-btn" data-filter="软件测评">软件测评</button>
                <button class="filter-btn" data-filter="公告">公告</button>
                <button class="filter-btn" data-filter="工具">工具</button>
            </div>
        </div>
        
        <!-- 添加滚动容器 -->
        <div class="articles-container-wrapper">
            <ul class="articles-list" id="articles-container">
                <!-- 文章列表将通过JavaScript动态生成 -->
            </ul>
        </div>
        
        <div class="pagination">
            <!-- 分页按钮将通过JavaScript动态生成 -->
        </div>
    </main>
    <!-- Placeholder: footer injected by /js/common.js -->
    <div id="site-footer"></div>
</body>
</html>
