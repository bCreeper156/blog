<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>链接与资源 - 156博客</title>
    <script src="/js/legacy_redirect.js"></script>
    <script src="js/dark_fix.js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/link.css">
    <script src="/js/loading.js"></script>
    <script src="/js/common.js" defer></script>
    <script src="/js/page_transition.js" defer></script>
    <script src="/js/jump_warning.js" defer></script>
    <script src="/js/link.js" defer></script>
    <script src="js/nope.js"></script>
<link rel="icon" type="image/png" href="/images/LOGO_dark.png">
</head>
<body>
    <!-- Placeholder: header injected by /js/common.js -->
    <div id="site-header"></div>
<!-- === 156博客 链接页面专用 HTML === -->
    <div class="link-page">
        <!-- 友链模式返回按钮（整页左上角） -->
        <a href="/link.html" class="friend-back-btn" id="friend-back" hidden>← 返回链接页</a>
   
        <!-- 移动端横向目录 -->
        <div class="mobile-catalog">
            <a href="#section-shortcuts"><span class="material-symbols-rounded">bolt</span> 快捷链接</a>
            <a href="#section-friends"><span class="material-symbols-rounded">handshake</span> 友情链接</a>
            <a href="#section-projects"><span class="material-symbols-rounded">build</span> 我的项目</a>
        </div>
    
        <!-- 左侧目录 -->
        <div class="sidebar">
            <h3>页面导航</h3>
            <div id="menu-list"></div>
        </div>
    
        <!-- 右侧主内容 -->
        <div class="main-content">
            <!-- 快捷链接 -->
            <div class="section" id="section-shortcuts">
                <div class="section-title"><span class="material-symbols-rounded">bolt</span> 快捷链接</div>
                <div class="card-grid" id="shortcut-grid"></div>
            </div>
    
            <!-- 友情链接 -->
            <div class="section" id="section-friends">
                <div class="section-title"><span class="material-symbols-rounded">handshake</span> 友情链接</div>
                <div class="friend-search-wrap" id="friend-search-wrap" hidden>
                    <span class="material-symbols-rounded friend-search-icon" aria-hidden="true">search</span>
                    <input type="search" class="friend-search" id="friend-search"
                           placeholder="搜索友链名称或简介…" aria-label="搜索友链" autocomplete="off">
                </div>
                <div class="card-grid" id="friend-grid"></div>
            </div>
    
            <!-- 我的项目 -->
            <div class="section" id="section-projects">
                <div class="section-title"><span class="material-symbols-rounded">build</span> 我的项目</div>
                <div class="card-grid" id="project-grid"></div>
            </div>
	    <!-- GitHub 引导 -->
            <div class="section github-cta">
                <div class="section-title"><span class="material-symbols-rounded">public</span> 关注更多内容</div>
                <p>更多开源项目、更新动态和技术分享，欢迎访问我的 GitHub 主页。</p>
                <a href="/jump_warning.html?url=https://github.com/bCreeper156" class="github-cta-link" target="_self">前往 GitHub →</a>
            </div>
        </div>
    </div>
    <!-- Placeholder: footer injected by /js/common.js -->
    <div id="site-footer"></div>
</body>
</html>
